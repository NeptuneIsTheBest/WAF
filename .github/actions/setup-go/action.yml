name: Set up Go with scoped caches
description: Restore Go modules and a separate build cache for each CI workload.
inputs:
  cache-scope:
    description: The job or workload owning the build cache.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      id: go
      with:
        go-version: '1.27.x'
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-mod-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
    # Populate all modules before any job can save the shared module cache.
    - name: Download Go modules
      shell: bash
      run: go mod download
    - name: Cache Go build outputs
      uses: actions/cache@v4
      with:
        path: ${{ steps.paths.outputs.build }}
        key: go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-${{ hashFiles('go.mod', 'go.sum') }}-
          go-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ inputs.cache-scope }}-
